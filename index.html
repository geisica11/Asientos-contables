<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asientos de diario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.min.css">
</head>

<body>


    <div class="container-fluid mt-3">

        <div class="row">

            <div class="col">

                <div class="card">

                    <div class="card-header">Registro de Asientos</div>

                    <div class="card-body">

                        <form id="formulario_asientos">

                            <div>
                                <label class="fw-bold">Categoria</label>
                                <select name="categorias" id="categorias" class="form-control" required>
                                    <option value="1" selected>Activo</option>
                                    <option value="2">Ingreso</option>
                                    <option value="3">Gasto</option>
                                    <option value="4">Capital</option>
                                    <option value="5">Pasivo</option>
                                </select>
                            </div>

                            <div class="mt-2">
                                <label class="fw-bold">Nombre Cuenta</label>
                                <input type="text" max="50" name="nombre" id="nombre" class="form-control" required>
                            </div>

                            <div class="mt-2">
                                <label class="fw-bold">Debe o Haber</label>
                                <select name="debe_haber" id="debe_haber" class="form-control" required>
                                    <option value="1" selected>Debe</option>
                                    <option value="2">Haber</option>
                                </select>
                            </div>

                            <div class="mt-2">
                                <label class="fw-bold">Monto</label>
                                <input type="number" name="monto" id="monto" class="form-control">
                            </div>

                            <div class="mt-2 text-end">
                                <button class="btn btn-sm btn-warning" type="submit">Agregar</button>
                            </div>

                        </form>

                    </div>

                </div>

            </div>

            <div class="col">
                <div class="card">
                    <div class="card-header">Tabla</div>

                    <div class="card-body">

                        <table class="table table-striped" style="width:100%">
                            <thead>
                                <tr>
                                    <th>Categoria</th>
                                    <th>Nombre</th>
                                    <th>Tipo</th>
                                    <th>Monto</th>
                                    <th>Eliminar</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Activo</td>
                                    <td>Efectivo</td>
                                    <td>Debe</td>
                                    <td>1000</td>
                                    <td><button class="delete-btn btn btn-danger btn-sm">X</button></td>
                                </tr>
                                <tr>
                                    <td>Pasivo</td>
                                    <td>Préstamo</td>
                                    <td>Haber</td>
                                    <td>500</td>
                                    <td><button class="delete-btn btn btn-danger btn-sm">X</button></td>
                                </tr>
                            </tbody>
                        </table>

                        <div class="text-end">
                            <button class="btn btn-success">Calcular</button>
                        </div>


                    </div>

                </div>
            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/ui/1.14.0/jquery-ui.min.js"
        integrity="sha256-Fb0zP4jE3JHqu+IBB9YktLcSjI1Zc6J2b6gTjB0LpoM=" crossorigin="anonymous"></script>
        <script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>


    <script>

        $(document).ready(function () {
            $('.table').DataTable();
            let asientos_diario = [];

            $('#formulario_asientos').submit(function () {
                event.preventDefault();

                let datos_formulario = new FormData(this);
                let array_temp = [];

                datos_formulario.forEach(function (valor, clave) {
                    array_temp.push(valor);
                    console.log(valor);
                })
                
                asientos_diario.push(array_temp);
                
                console.log(asientos_diario);
                
                //Reinicia los campos del formulario
                this.reset();
            })


           
        });

    </script>
</body>

</html>
